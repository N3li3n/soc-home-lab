title: Suspicious PowerShell Execution
id: 32345678-1234-1234-1234-123456789012
status: stable
description: Detects PowerShell with encoded commands or download cradle
author: Skyline
date: 2026/10/09
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains:
            - '-enc'
            - '-EncodedCommand'
            - 'FromBase64String'
            - 'DownloadString'
            - 'IEX'
    condition: selection
falsepositives:
    - Legitimate administrative scripts
level: high
tags:
    - attack.execution
    - attack.t1059.001
